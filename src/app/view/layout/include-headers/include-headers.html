      <ul class="p-0 m-0">
        <li class="mb-3 d-flex justify-content-around my-3 ">
          <img class="img-header" src="/img/navicon.svg" alt="navicon">
          <img src="/img/navbrand.svg" alt="navbrand">
        </li>

        <li class="ps-4" *ngFor="let item of navItems">
          <a [href]="item.href" class="nav-link d-flex align-items-center gap-2" (click)="closeMenu()">
