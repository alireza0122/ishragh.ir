<div class="mt-5 ">
  <div class="container-fluid mx-auto px-5 mb-2 ">
    <div class="row">
      <div class="col-12  d-flex justify-content-center">
        <div class="shared-box">
          <h3 class="p-0 m-0 shared-box-title fw-bold fs-lg-32px fs-md-20px  fs-16px">
            امکانات سامانه
          </h3>
          <div class="dd"></div>
        </div>
      </div>
    </div>
  </div>

<!--  <img class="w-100" src="/img/image.psd.png">-->
  <div class="show-facilities">
    <div class="container-fluid  ">
      <div class="row ">
        @for (item of newsdata; track $index) {
          <div class="col-12 col-lg-4 my-0 my-lg-4 mt-3 mt-lg-0 ">
            <div class="facilities-item my-2">
              <div  class="facilities-item-img">
                <img class="facilities-item-img-top" [src]="item.img" [alt]="item.title">
              </div>

              <h3 class="facilities-item-title fs-16px fs-lg-20px text-center fw-bold  text-justify text-over o1 mt-2">{{ item.title }}</h3>
              <div class="d-flex justify-content-center">
                <p class="mw-50  fs-14px fs-md-20px text-center ">{{item.description}}</p>
              </div>

            </div>
          </div>
        }

      </div>
    </div>

  </div>
</div>
